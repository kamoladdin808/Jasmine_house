<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D0303">
  <title>Jasmin Bakery — Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #0D0303;
      --deep: #1E0808;
      --gold: #F7AA4F;
      --cream: #FFEFD9;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--void);
      color: var(--cream);
      min-height: 100vh;
      padding: 26px 18px;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    a.back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 239, 217, .55);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    a.back:hover {
      color: var(--gold);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    h1 em {
      color: var(--gold);
      font-style: italic;
    }

    p.lead {
      font-size: 13px;
      line-height: 1.65;
      color: rgba(255, 239, 217, .72);
      margin-bottom: 14px;
    }

    .banner {
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .banner.warn {
      border: 1px solid rgba(232, 136, 136, .35);
      background: rgba(80, 20, 20, .25);
      color: #ebb;
    }

    .banner.ok {
      border: 1px solid rgba(247, 170, 79, .25);
      background: rgba(247, 170, 79, .06);
      color: rgba(255, 239, 217, .88);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0 12px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .fbtn {
      border: 1px solid rgba(247, 170, 79, .22);
      background: rgba(247, 170, 79, .08);
      color: rgba(255, 239, 217, .8);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 9px 12px;
      border-radius: 3px;
      cursor: pointer;
    }

    .fbtn:hover {
      background: rgba(247, 170, 79, .14);
      color: var(--gold);
    }

    .fbtn.active {
      background: linear-gradient(135deg, rgba(247, 170, 79, .9), rgba(247, 170, 79, .55));
      color: var(--void);
      border-color: transparent;
    }

    .logout {
      border: 1px solid rgba(255, 239, 217, .14);
      background: rgba(255, 239, 217, .06);
      color: rgba(255, 239, 217, .78);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 9px 12px;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
    }

    .logout:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(247, 170, 79, .08);
    }

    .list {
      margin-top: 10px;
    }

    .order-card {
      border: 1px solid rgba(247, 170, 79, .12);
      background: rgba(30, 8, 8, .5);
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .order-card .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }

    .order-card .id {
      font-weight: 700;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: .04em;
    }

    .order-card .st {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255, 239, 217, .45);
      white-space: nowrap;
    }

    .meta {
      font-size: 12px;
      color: rgba(255, 239, 217, .55);
      line-height: 1.55;
    }

    .order-lines {
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 239, 217, .55);
      margin: 10px 0 8px;
      padding-left: 0;
      list-style: none;
    }

    .order-lines li {
      padding: 2px 0;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 9px 12px;
      border: 1px solid rgba(247, 170, 79, .25);
      background: rgba(247, 170, 79, .1);
      color: var(--gold);
      cursor: pointer;
      border-radius: 2px;
    }

    .actions button:hover {
      background: rgba(247, 170, 79, .18);
    }

    .actions button:disabled {
      opacity: .35;
      cursor: default;
    }

    @media(max-width:520px) {
      body {
        padding: 20px 14px;
      }

      .order-card {
        padding: 12px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="menu.html">← Меню</a>
      <button type="button" class="logout" id="jbLogoutBtn">Выйти</button>
    </div>

    <h1>Панель <em>персонала</em></h1>
    <p class="lead">Доступ только для персонала. Заказы загружаются с сервера.</p>

    <div class="banner" id="jbBanner" role="status">Загрузка…</div>

    <div class="controls" aria-label="Фильтры">
      <div class="filters" id="jbFilters">
        <button type="button" class="fbtn" data-st="all">Все</button>
        <button type="button" class="fbtn" data-st="new">Новые</button>
        <button type="button" class="fbtn" data-st="preparing">Готовятся</button>
        <button type="button" class="fbtn" data-st="delivery">В пути</button>
        <button type="button" class="fbtn" data-st="done">Выполнены</button>
      </div>
    </div>

    <div class="list" id="jbOrders"></div>
  </div>

  <script>
    (function () {
      'use strict';

      var API_BASE = ''; // сюда вставить URL бэкенда
      var TOKEN_KEY = 'jh_jwt';
      var STAFF_ROLES = ['admin', 'manager', 'kitchen', 'staff', 'courier'];

      var POLL_MS = 30000;
      var timer = null;

      var banner = document.getElementById('jbBanner');
      var listEl = document.getElementById('jbOrders');
      var logoutBtn = document.getElementById('jbLogoutBtn');
      var filtersEl = document.getElementById('jbFilters');

      var activeFilter = 'default';
      var cache = [];

      function apiUrl(path) {
        var base = String(API_BASE || '').replace(/\/$/, '');
        if (!base) return path;
        if (path.charAt(0) !== '/') path = '/' + path;
        return base + path;
      }

      function setBannerOk(text) {
        if (!banner) return;
        banner.className = 'banner ok';
        banner.textContent = text;
      }

      function setBannerWarn(text) {
        if (!banner) return;
        banner.className = 'banner warn';
        banner.textContent = text;
      }

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      }

      function getToken() {
        try {
          return localStorage.getItem(TOKEN_KEY) || '';
        } catch (e) {
          return '';
        }
      }

      function clearToken() {
        try {
          localStorage.removeItem(TOKEN_KEY);
        } catch (e) { }
      }

      function parseJwtPayload(token) {
        if (!token || typeof token !== 'string') return null;
        var parts = token.split('.');
        if (parts.length < 2) return null;
        try {
          var s = parts[1].replace(/-/g, '+').replace(/_/g, '/');
          while (s.length % 4) s += '=';
          var json = decodeURIComponent(
            Array.prototype.map
              .call(atob(s), function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
              })
              .join('')
          );
          return JSON.parse(json);
        } catch (e) {
          return null;
        }
      }

      function normalizeRoles(payload) {
        if (!payload) return [];
        var r = payload.roles;
        if (typeof r === 'string') {
          return r
            .split(',')
            .map(function (x) { return x.trim(); })
            .filter(Boolean);
        }
        if (Array.isArray(r)) return r.map(String);
        return [];
      }

      function hasAnyRole(roles, allow) {
        if (!allow || !allow.length) return false;
        for (var i = 0; i < allow.length; i++) {
          if (roles.indexOf(allow[i]) !== -1) return true;
        }
        return false;
      }

      function redirectToMenu() {
        location.href = 'menu.html';
      }

      function ensureAccess() {
        var t = getToken();
        if (!t) return false;
        var p = parseJwtPayload(t);
        if (!p) return false;
        if (p.exp != null && Date.now() / 1000 > Number(p.exp)) return false;
        var roles = normalizeRoles(p);
        return hasAnyRole(roles, STAFF_ROLES);
      }

      function fmtDate(ts) {
        var n = Number(ts);
        if (!n) return '—';
        try {
          return new Date(n).toLocaleString('ru');
        } catch (e) {
          return '—';
        }
      }

      function statusLabel(st) {
        if (st === 'new') return 'Новый';
        if (st === 'preparing') return 'Готовится';
        if (st === 'delivery') return 'В пути';
        if (st === 'done') return 'Выполнен';
        return String(st || '—');
      }

      function itemLine(it, currency) {
        var name = it && (it.name || it.title || it.product_name);
        var qty = it && (it.qty || it.quantity || it.count);
        var price = it && (it.price || it.unit_price);
        var sum = 0;
        try {
          sum = Number(price || 0) * Number(qty || 0);
        } catch (e) { }
        return (
          '<li>' +
          esc(name) +
          ' × ' +
          esc(qty) +
          ' — ' +
          Number(sum || 0).toLocaleString('ru') +
          (currency ? ' ' + esc(currency) : '') +
          '</li>'
        );
      }

      function nextActionForStatus(st) {
        if (st === 'new') return { next: 'preparing', text: 'Принять в работу' };
        if (st === 'preparing') return { next: 'delivery', text: 'В доставку' };
        if (st === 'delivery') return { next: 'done', text: 'Выполнен' };
        return null;
      }

      function renderOrders(list) {
        if (!listEl) return;

        var filtered = [];
        for (var i = 0; i < list.length; i++) {
          var o = list[i];
          var st = (o && (o.status || o.state)) || '';

          if (activeFilter === 'default') {
            if (String(st) === 'done') continue;
            filtered.push(o);
            continue;
          }

          if (activeFilter === 'all') {
            filtered.push(o);
            continue;
          }

          if (String(st) === String(activeFilter)) filtered.push(o);
        }

        if (!filtered.length) {
          listEl.innerHTML =
            '<p class="meta" style="padding:10px 2px">Пока нет заказов по выбранному фильтру.</p>';
          return;
        }

        listEl.innerHTML = filtered
          .map(function (o) {
            var id = o && (o.id || o.order_id || o.number);
            var st = (o && (o.status || o.state)) || '';
            var created = o && (o.createdAt || o.created_at || o.created);
            var customerName = o && (o.customerName || o.customer_name || (o.customer && o.customer.name));
            var phone = o && (o.phone || o.customerPhone || o.customer_phone || (o.customer && o.customer.phone));
            var address = o && (o.address || o.deliveryAddress || o.delivery_address);
            var items = (o && (o.items || o.lines || o.positions)) || [];
            var total = o && (o.total || o.amount || o.sum);
            var currency = o && (o.currencyLabel || o.currency || o.currency_label);

            var linesHtml = Array.isArray(items)
              ? items.map(function (it) { return itemLine(it, currency); }).join('')
              : '';

            var next = nextActionForStatus(String(st));
            var actionBtn = '';
            if (next) {
              actionBtn =
                '<button type="button" class="jb-next" data-id="' + esc(id) + '" data-next="' + esc(next.next) + '">' +
                esc(next.text) +
                '</button>';
            }

            return (
              '<div class="order-card" data-order-id="' + esc(id) + '">' +
              '<div class="top">' +
              '<span class="id">#' + esc(id) + '</span>' +
              '<span class="st">' + esc(statusLabel(String(st))) + '</span>' +
              '</div>' +
              '<div class="meta">' +
              esc(customerName) +
              (phone ? ' · ' + esc(phone) : '') +
              (address ? '<br>' + esc(address) : '') +
              '</div>' +
              (linesHtml ? '<ul class="order-lines">' + linesHtml + '</ul>' : '') +
              '<div class="meta">Итого: ' + Number(total || 0).toLocaleString('ru') + (currency ? ' ' + esc(currency) : '') + '</div>' +
              '<div class="meta" style="margin-top:6px">Создан: ' + esc(fmtDate(created)) + '</div>' +
              '<div class="actions">' + actionBtn + '</div>' +
              '</div>'
            );
          })
          .join('');
      }

      function fetchOrders() {
        var t = getToken();
        if (!t) {
          setBannerWarn('Нет токена. Войдите в аккаунт.');
          redirectToMenu();
          return Promise.reject(new Error('no_token'));
        }
        if (!API_BASE) {
          setBannerWarn('Не задан API_BASE. Укажите URL бэкенда в staff.html.');
          return Promise.reject(new Error('no_api_base'));
        }

        return fetch(apiUrl('/orders'), {
          method: 'GET',
          headers: { Authorization: 'Bearer ' + t },
        })
          .then(function (res) {
            if (!res.ok) {
              return res.text().then(function (txt) {
                throw new Error(txt || 'orders_failed');
              });
            }
            return res.json();
          })
          .then(function (data) {
            var arr = data;
            if (data && Array.isArray(data.orders)) arr = data.orders;
            if (data && Array.isArray(data.items)) arr = data.items;
            if (!Array.isArray(arr)) arr = [];
            cache = arr;
            setBannerOk('Заказы: ' + String(arr.length));
            renderOrders(cache);
            return arr;
          })
          .catch(function (err) {
            setBannerWarn('Ошибка загрузки заказов: ' + (err && err.message ? err.message : String(err)));
            return [];
          });
      }

      function patchStatus(id, nextStatus, btn) {
        var t = getToken();
        if (!t) {
          redirectToMenu();
          return;
        }
        if (!API_BASE) {
          setBannerWarn('Не задан API_BASE.');
          return;
        }

        if (btn) btn.disabled = true;

        fetch(apiUrl('/orders/' + encodeURIComponent(String(id))), {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + t,
          },
          body: JSON.stringify({ status: nextStatus }),
        })
          .then(function (res) {
            if (!res.ok) {
              return res.text().then(function (txt) {
                throw new Error(txt || 'status_failed');
              });
            }
            return res.json();
          })
          .then(function () {
            for (var i = 0; i < cache.length; i++) {
              var o = cache[i];
              var oid = o && (o.id || o.order_id || o.number);
              if (String(oid) === String(id)) {
                if (o.status != null) o.status = nextStatus;
                else o.state = nextStatus;
                break;
              }
            }
            renderOrders(cache);
            setBannerOk('Статус обновлён: #' + String(id) + ' → ' + statusLabel(nextStatus));
          })
          .catch(function (err) {
            setBannerWarn('Ошибка обновления статуса: ' + (err && err.message ? err.message : String(err)));
          })
          .finally(function () {
            if (btn) btn.disabled = false;
          });
      }

      function setFilter(st) {
        activeFilter = st;
        if (filtersEl) {
          var btns = filtersEl.querySelectorAll('.fbtn');
          for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('active', btns[i].getAttribute('data-st') === st);
          }
        }
        renderOrders(cache);
      }

      function startPolling() {
        if (timer) clearInterval(timer);
        timer = setInterval(fetchOrders, POLL_MS);
      }

      if (!ensureAccess()) {
        redirectToMenu();
        return;
      }

      setFilter('default');
      fetchOrders();
      startPolling();

      if (logoutBtn) {
        logoutBtn.onclick = function () {
          clearToken();
          redirectToMenu();
        };
      }

      if (filtersEl) {
        filtersEl.onclick = function (e) {
          var btn = e.target.closest('.fbtn');
          if (!btn) return;
          var st = btn.getAttribute('data-st');
          if (st) setFilter(st);
        };
      }

      if (listEl) {
        listEl.onclick = function (e) {
          var btn = e.target.closest('.jb-next');
          if (!btn) return;
          var id = btn.getAttribute('data-id');
          var next = btn.getAttribute('data-next');
          if (!id || !next) return;
          patchStatus(id, next, btn);
        };
      }
    })();
  </script>
</body>

</html>
